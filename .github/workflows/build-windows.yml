name: Build Windows desktop app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed only to attach the installer to a GitHub Release on v* tags

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Install PyInstaller with a freshly compiled bootloader (avoids antivirus false positives)
        shell: pwsh
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: python -m pip install --no-binary pyinstaller pyinstaller==6.11.1

      - name: Run tests
        run: python -m pytest -q

      - name: Work out version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path relay/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF -like "refs/tags/v*") { $v = $env:GITHUB_REF_NAME.TrimStart("v") }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build app (PyInstaller)
        run: pyinstaller --noconfirm --clean packaging/relay.spec

      - name: Self-test the built app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\RelayCRM\RelayCRM.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "Built app failed its self-test (exit $($p.ExitCode))"; exit 1 }
          Write-Host "Self-test passed"

      - name: Microsoft Defender scan (report only)
        shell: pwsh
        continue-on-error: true
        run: |
          $mp = Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe" -ErrorAction SilentlyContinue | Select-Object -Last 1
          if (-not $mp) { $mp = Get-Item "$env:ProgramFiles\Windows Defender\MpCmdRun.exe" -ErrorAction SilentlyContinue }
          if (-not $mp) { Write-Host "Defender not available on this runner"; exit 0 }
          & $mp.FullName -SignatureUpdate | Out-Host
          & $mp.FullName -Scan -ScanType 3 -File "$PWD\dist\RelayCRM" -DisableRemediation | Out-Host
          Write-Host "DEFENDER_EXIT=$LASTEXITCODE  (0 = clean, 2 = threat found)"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Portable zip (no install needed)
        shell: pwsh
        run: Compress-Archive -Path dist\RelayCRM\* -DestinationPath "Output\RelayCRM-Portable-${{ steps.ver.outputs.version }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: RelayCRM-Setup-${{ steps.ver.outputs.version }}
          path: Output/RelayCRM-Setup-*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: RelayCRM-Portable-${{ steps.ver.outputs.version }}
          path: Output/RelayCRM-Portable-*.zip

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Output/RelayCRM-Setup-*.exe
            Output/RelayCRM-Portable-*.zip
