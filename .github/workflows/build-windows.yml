# Builds the Windows installer on every tag (v2.0.0 ...) or on demand.
# Download it from the run's "Artifacts" section, or from the GitHub Release for tags.
name: Build Windows installer
on:
  workflow_dispatch:
  push:
    branches: [team-v2]
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Decode signing certificate (optional)
        if: ${{ env.SIGN_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\sign.pfx", [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          "SIGN_PFX=$env:RUNNER_TEMP\sign.pfx" >> $env:GITHUB_ENV
      - name: Build
        shell: pwsh
        env:
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: powershell -ExecutionPolicy Bypass -File deploy\windows\build_windows.ps1
      - name: Self-test the built server
        shell: pwsh
        run: |
          $data = Join-Path $env:RUNNER_TEMP "relay-selftest"
          $p = Start-Process -FilePath "dist\RelayCRM\RelayCRM.exe" -ArgumentList "--local","--no-browser","--port","5099","--data-dir",$data -PassThru
          $ok = $false
          foreach ($i in 1..40) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-WebRequest "http://127.0.0.1:5099/healthz" -UseBasicParsing -TimeoutSec 3; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch {}
          }
          if ($ok) { $r2 = Invoke-WebRequest "http://127.0.0.1:5099/" -UseBasicParsing -TimeoutSec 10; Write-Host "Home page HTTP $($r2.StatusCode)" }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Get-ChildItem $data -Recurse -Filter *.log | ForEach-Object { Get-Content $_.FullName -Tail 40 }; Write-Error "Built server did not start"; exit 1 }
          Write-Host "Self-test passed"

      - name: Microsoft Defender scan (report only)
        shell: pwsh
        continue-on-error: true
        run: |
          $mp = Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe" -ErrorAction SilentlyContinue | Select-Object -Last 1
          if (-not $mp) { Write-Host "Defender not available"; exit 0 }
          & $mp.FullName -SignatureUpdate | Out-Host
          & $mp.FullName -Scan -ScanType 3 -File "$PWD\dist" -DisableRemediation | Out-Host
          Write-Host "DEFENDER_EXIT=$LASTEXITCODE  (0 = clean, 2 = threat found)"

      - uses: actions/upload-artifact@v4
        with:
          name: RelayCRM-Setup
          path: dist/RelayCRM-Setup-*.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RelayCRM-Setup-*.exe

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest && pytest -q tests
