{% extends 'base.html' %}
{% block title %}Organization{% endblock %}
{% block body %}
<div class="head"><h1>{{ 'Edit ' ~ o.name if o.id else 'New organization' }}</h1></div>
<form method="post" class="card" style="max-width:760px"><input type="hidden" name="_csrf" value="{{ csrf }}">
  <div class="row"><div class="field"><label>Name</label><input name="name" value="{{ o.name or '' }}" required></div>
    <div class="field" style="flex:0 0 180px"><label>Type</label><select name="org_type">{% for t in ORG_TYPES %}<option {{ 'selected' if o.org_type==t }}>{{ t }}</option>{% endfor %}</select></div></div>
  <div class="row"><div class="field"><label>Email domain</label><input name="domain" value="{{ o.domain or '' }}" placeholder="agency.gov"><div class="small muted">New people emailing from this domain are filed here automatically.</div></div>
    <div class="field"><label>Phone</label><input name="phone" value="{{ o.phone or '' }}"></div></div>
  <div class="field"><label>Website</label><input name="website" value="{{ o.website or '' }}"></div>
  <div class="field"><label>Address</label><textarea name="address" style="min-height:60px">{{ o.address or '' }}</textarea></div>
  <div class="field"><label>Notes</label><textarea name="notes">{{ o.notes or '' }}</textarea></div>
  <button class="btn primary">Save</button> <a class="btn" href="{{ '/orgs/' ~ o.id if o.id else '/orgs' }}">Cancel</a>
</form>
{% endblock %}
