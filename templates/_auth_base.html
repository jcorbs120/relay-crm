<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Sign in{% endblock %} · Relay CRM</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231f4e8c'/><text x='16' y='22' font-size='17' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>R</text></svg>">
</head><body>
<div class="auth-wrap"><div class="auth-card {% block cardclass %}{% endblock %}">
  <div class="brand"><div class="logo" style="color:#fff">R</div><div>Relay CRM{% if S.firm_name %}<div class="firm" style="color:var(--muted)">{{ S.firm_name }}</div>{% endif %}</div></div>
  {% with msgs = get_flashed_messages(with_categories=true) %}{% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}{% endwith %}
  {% block body %}{% endblock %}
</div></div>
</body></html>
